[project]
name = "tracknet-coreml"
version = "0.1.0"
description = "Core ML port of TrackNetV3 shuttlecock/ball tracking: converter, on-device inference, and benchmarks for Apple Silicon"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
convert = ["coremltools>=8.0"]

[project.scripts]
tracknet-bench = "tracknet_coreml.bench:main"
tracknet-convert = "tracknet_coreml.convert:main"
tracknet-track = "tracknet_coreml.track:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracknet_coreml"]
